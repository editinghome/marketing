    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            background: #fff;
            color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Hero */
        .hero {
            flex: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #f4f4f4;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 40px 28px 32px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
    justify-content: center;
        }

        .lotus-logo {
            width: 168px;
            height: 168px;
            border-radius: 50%;
            padding: 2px;
            background: #27671b;
            margin-bottom: 22px;
            box-shadow: 0 0 0 2px #27671b;
            overflow: hidden;
        }

        .lotus-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            background: #1b4332;
        }

        .hero-name {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 36px;
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 56px;
            border-radius: 999px;
            background: #128c7e;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 28px;
            box-shadow: 0 8px 22px rgba(26, 60, 52, 0.25);
            animation: jump 1.35s ease-in-out infinite;
        }

        .btn-wa .wa-icon {
            font-size: 20px;
            color: #25d366;
        }

        .btn-wa .tick {
            color: #1da1f2;
            font-size: 18px;
        }

        @keyframes jump {
            0%, 55%, 100% { transform: translateY(0); }
            20% { transform: translateY(-16px); }
            35% { transform: translateY(0); }
            45% { transform: translateY(-8px); }
        }

        .hero-sub {
            font-size: 16px;
            color: #333;
            font-weight: 400;
        }

        @media (max-width: 560px) {
            .hero {
                padding: 20px 14px;
            }

            .card {
                padding: 32px 20px 26px;
            }

            .lotus-logo {
                width: 140px;
                height: 140px;
                margin-bottom: 20px;
            }

            .hero-name {
                font-size: 24px;
                margin-bottom: 28px;
            }

            .btn-wa {
                width: 100%;
                padding: 15px 24px;
                font-size: 16px;
            }
        }
    </style>

<body>

    <main class="hero">
        <div class="card">
            <div class="lotus-logo">
                <img src="lotus365.webp" alt="Lotus365">
            </div>
            <h1 class="hero-name">Lotus365</h1>
            <a class="btn-wa" href="https://wa.link/lak?text=Can%20I%20get%20more%20information%3F" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp wa-icon"></i> Whatsapp Now <i class="fa-solid fa-circle-check tick"></i></a>
            <p class="hero-sub">Hello, I want new ID</p>
        </div>
    </main>

</body>
